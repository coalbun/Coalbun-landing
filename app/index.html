  // ---------- Spelet ----------
  function startGame() {
    var n = state.players.length;
    var g = { round: 0, total: planRounds(n).total, duo: n === 2, history: [], scores: {}, played: {}, pairCount: {}, pairMatch: {}, lastPair: null };
    state.players.forEach(function (p) { g.scores[p.id] = 0; g.played[p.id] = 0; });
    state.game = g;
    show("round");
    newRound();
  }

  function newRound() {
    var g = state.game;
    g.round++;
    g.pair = nextPair(g);
    g.lastPair = g.pair;
    g.question = nextQuestion(state.cat);
    g.phase = "ready";
    g.winners = [];
    renderRound(true);
    playVS(byId(g.pair[0]), byId(g.pair[1]));
  }


  // Namn som inte får plats krymper. Först ett steg i taget ner till data-fit (px), som är en
  // bra läsbar storlek. Räcker inte det krymper namnet exakt så mycket som behövs. Aldrig "…".
  // Bredden mäts exakt (Safari sätter "…" redan vid en bråkdel av en pixel) och utan pågående animationer.
  function textWidth(el) {
    var r = document.createRange(); r.selectNodeContents(el);
    var box = el.getBoundingClientRect(), k = box.width ? el.offsetWidth / box.width : 1;
    return r.getBoundingClientRect().width * k;
  }
  function fitOne(el, min) {
    el.style.fontSize = "";
    if (!el.clientWidth) return;
    var cs = getComputedStyle(el), size = parseFloat(cs.fontSize);
    var room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 1;
    min = min || Number(el.dataset.fit) || 10;
    while (textWidth(el) > room && size > min) { size -= 1; el.style.fontSize = size + "px"; }
    for (var i = 0; i < 6 && textWidth(el) > room && size > 4; i++) {
      size = Math.max(4, Math.floor(size * room / textWidth(el) * 10) / 10);
      el.style.fontSize = size + "px";
    }
    el._fitW = el.clientWidth;
  }
  // Ändras rutans bredd efteråt (tangentbord, fler spelare, typsnitt) mäts namnet om
  var fitObs = window.ResizeObserver ? new ResizeObserver(function (list) {
    list.forEach(function (e) {
      var el = e.target;
      if (Math.abs(el.clientWidth - (el._fitW || 0)) >= 1) requestAnimationFrame(function () { fitOne(el); });
    });
  }) : null;
  function fitNames(root) {
    root.querySelectorAll("[data-fit]").forEach(function (el) { fitOne(el); if (fitObs) fitObs.observe(el); });
  }

  function reducedMotion() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }

  // VS-intro: halvorna glider in, figurerna åker in, VS smäller. Cirka 2 sekunder, tryck för att hoppa över.
  var vsTimer = null, vsSlam = null;
  function playVS(a, b) {
    if (reducedMotion() || !a || !b) return;
    var fx = $("fx");
    clearTimeout(vsTimer); clearTimeout(vsSlam);
    fx.innerHTML = '<div class="vsfx" id="vsfx">' +
      '<div class="shake"><div class="pl">' + linesSVG("#fff", 0.11, 83, 44) + '</div><div class="pr">' + linesSVG("#111", 0.07, 17, 44) + '</div><div class="split"></div>' +
      '<div class="who a">' + esc(a.name) + '</div><div class="who b">' + esc(b.name) + "</div>" +
      '<div class="f a" id="vs-fa"></div><div class="f b" id="vs-fb"></div>' +
      '<div class="mid">' + burstSVG("#fff", "htB") + '<div class="word">' + wordSVG("VS", "#111", "#fff", "#111") + "</div></div>" +
      '<div class="flash"></div></div><div class="skip">Tryck för att hoppa över</div></div>';
    // Varje namn får bara plats på sin sida av diagonalen. Diagonalen lutar 7,5 grader,
    // så vid namnens höjd ligger den till höger om mitten och högra sidan blir smalare.
    // Långa namn krymps så att de får plats, i stället för att kapas.
    (function () {
      var W = fx.clientWidth || innerWidth, H = fx.clientHeight || innerHeight;
      var tilt = Math.tan(7.5 * Math.PI / 180), gap = 7 + 5, edge = W * 0.035;
      var names = fx.querySelectorAll(".who"), size = Infinity;
      names.forEach(function (el) {
        var y = el.offsetTop + el.offsetHeight / 2;
        var lineX = W / 2 + tilt * (H / 2 - y);
        var room = el.classList.contains("a") ? lineX - gap - edge : W - edge - lineX - gap;
        el.style.maxWidth = Math.max(60, Math.floor(room)) + "px";
        fitOne(el, 10);
        size = Math.min(size, parseFloat(getComputedStyle(el).fontSize));
      });
      // Båda namnen lika stora, så att det ser jämnt ut
      names.forEach(function (el) { el.style.fontSize = size + "px"; });
    })();
    window.Figures.mount($("vs-fa"), a.fig, { phase: 0 });
    window.Figures.mount($("vs-fb"), b.fig, { phase: 0.4 });
    Sound.play("whoosh");
    vsSlam = setTimeout(function () { Sound.play("vs"); buzz([30, 40, 70]); Confetti.blast(innerWidth / 2, innerHeight * 0.44); }, 640);
    function close() {
      clearTimeout(vsSlam); clearTimeout(vsTimer);
      var el = $("vsfx"); if (!el) return;
      el.classList.add("closing");
      vsTimer = setTimeout(function () { fx.innerHTML = ""; }, 200);
    }
    vsTimer = setTimeout(function () { fx.innerHTML = ""; }, 2150);
    $("vsfx").addEventListener("pointerdown", close);
  }

  // "Vem har …"-frågor kan sakna svar om ingen av de två har gjort saken. Då gäller "skulle" i stället.
  function isHarQuestion(q) { return /^Vem (av er )?har /i.test(q || ""); }

  function renderFighter(id, el) {
    var p = byId(id), g = state.game;
    var win = g.winners.indexOf(id) >= 0;
    var lose = g.phase === "voted" && g.winners.length > 0 && !win;
    el.className = "fighter" + (win ? " win" : "") + (lose ? " lose" : "");
    el.innerHTML = '<div class="fbadge">' + window.Figures.badge(p.fig) + (win ? '<span class="plus">+1</span>' : "") + "</div>" +
      '<span class="fighter-name' + (p.name.length > 9 ? " xlong" : p.name.length > 6 ? " long" : "") + '" data-fit="12">' + esc(p.name) + "</span>" +
      '<span class="fighter-score">' + g.scores[id] + " p</span>";
  }

  // Frågan görs så stor som möjligt, men får aldrig gå utanför kortet
  function fitQuestion() {
    var card = $("card"), q = card && card.querySelector(".question");
    if (!q || $("round").hidden) return;
    var cs = getComputedStyle(card);
    var availH = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var availW = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var lo = 16, hi = Math.max(lo, Math.min(64, availW * 0.17));
    q.style.overflowWrap = "normal";
    for (var i = 0; i < 12; i++) {
      var mid = (lo + hi) / 2;
      q.style.fontSize = mid + "px";
      if (q.scrollHeight <= availH && q.scrollWidth <= q.clientWidth + 1) lo = mid; else hi = mid;
    }
    // Radbrytningen ändras med storleken, så avrundningen kan få texten att ta en rad till. Kolla igen.
    var size = Math.floor(lo);
    q.style.fontSize = size + "px";
    while (size > 16 && (q.scrollHeight > availH || q.scrollWidth > q.clientWidth + 1)) { size--; q.style.fontSize = size + "px"; }
    if (q.scrollWidth > q.clientWidth + 1) q.style.overflowWrap = "anywhere";
  }
  window.addEventListener("resize", fitQuestion);

  var voteTimer = null;
  function stopVoteTimer() { clearInterval(voteTimer); voteTimer = null; }
  function startVoteTimer() {
    stopVoteTimer();
    var left = TIMER_SECONDS, el = $("timer");
    function draw() {
      if (!el) return;
      el.querySelector("span").textContent = left;
      el.querySelector(".ring").style.strokeDashoffset = (113.1 * (1 - left / TIMER_SECONDS)).toFixed(1);
    }
    draw();
    voteTimer = setInterval(function () {
      if (!el || !el.isConnected || !state.game || state.game.phase !== "vote") { stopVoteTimer(); return; }
      left--;
      draw();
      if (left > 0 && left <= 3) buzz(12);
      if (left <= 0) {
        stopVoteTimer();
        el.classList.add("done");
        $("hint").innerHTML = "<b>Tiden är ute. Rösta!</b>";
        Sound.play("timeup"); buzz([40, 60, 40]);
      }
    }, 1000);
  }

  var RED = "#d0283a", GOLD = "#f0b638";
  function slam(inner, pat, word) {
    return '<div class="slam">' + burstSVG(inner, pat) + word + "</div>";
  }

  function renderRound(fresh) {
    var g = state.game, a = byId(g.pair[0]), b = byId(g.pair[1]);
    var c = CATS[state.cat];
    var colorVar = { warmup: "var(--c-warm)", juicy: "var(--c-juicy)", crazy: "var(--c-crazy)" }[state.cat];
    $("round").style.setProperty("--c", colorVar);
    $("cat-pill").innerHTML = '<span class="dot"></span>' + c.name + ICON.chev;
    renderFighter(g.pair[0], $("fA"));
    renderFighter(g.pair[1], $("fB"));
    fitNames($("round").querySelector(".fighters") || $("round"));
    document.querySelector("#round .vs").classList.toggle("away", g.phase === "vote" || g.phase === "miss2");
    if (g.phase !== "vote") stopVoteTimer();

    var card = $("card"), actions = $("actions"), hint = $("hint");
    var meta = '<div class="card-meta">Runda ' + g.round + " av " + g.total + "</div>";
    var last = g.round >= g.total;
    function nextButton() {
      actions.innerHTML = '<button class="btn btn-primary" id="next">' + (last ? "Se resultat" : "Nästa runda") + "</button>";
      $("next").onclick = last ? showResults : newRound;
    }

    if (g.phase === "ready" || g.phase === "counting" || g.phase === "answer") {
      if (fresh || !card.querySelector(".question")) {
        card.innerHTML = meta + '<p class="question in">' + esc(g.question) + "</p>";
        fitQuestion();
        requestAnimationFrame(fitQuestion);
      }
    }

    if (g.phase === "ready") {
      hint.textContent = isHarQuestion(g.question) ? "Har ingen av er gjort det? Säg den som mest troligt skulle."
        : g.duo && g.round === 1 ? "Ni spelar som ett lag. Hur många matcher klarar ni av " + g.total + "?"
        : "På noll säger ni båda ett namn högt: ditt eget eller den andras.";
      actions.innerHTML = '<button class="btn btn-primary" id="go">Räkna ner</button>';
      $("go").onclick = countdown;
    } else if (g.phase === "counting") {
      hint.innerHTML = "&nbsp;";
      actions.innerHTML = '<button class="btn btn-primary" disabled>Räkna ner</button>';
    } else if (g.phase === "answer") {
      hint.innerHTML = "<b>Sa ni samma namn?</b>";
      actions.innerHTML = '<div class="btn-row"><button class="btn btn-ghost" id="diff">Olika</button><button class="btn btn-green" id="same">Samma</button></div>';
      $("same").onclick = onMatch;
      $("diff").onclick = onMismatch;
    } else if (g.phase === "match") {
      card.innerHTML = linesSVG(RED, 0.3, 50, 45) + meta + '<div class="verdict">' + slam(RED, "htRed", wordSVG("MATCH!", GOLD)) +
        '<p class="verdict-text">Plus ett till både ' + esc(a.name) + " och " + esc(b.name) + ".</p></div>";
      hint.innerHTML = "&nbsp;";
      nextButton();
    } else if (g.phase === "miss2") {
      card.innerHTML = linesSVG("#111", 0.1, 50, 45) + meta + '<div class="verdict">' + slam("#111", "htK", wordSVG("MISMATCH!", "#fff", "#111", RED)) +
        '<p class="verdict-text">Förklara er för varandra. Ingen poäng den här gången.</p></div>';
      hint.innerHTML = "&nbsp;";
      nextButton();
    } else if (g.phase === "vote") {
      card.innerHTML = linesSVG("#111", 0.1, 50, 45) + meta +
        '<div class="timer" id="timer"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="#fff" stroke="#111" stroke-width="4"/>' +
        '<circle class="ring" cx="22" cy="22" r="18" fill="none" stroke="' + RED + '" stroke-width="5" stroke-dasharray="113.1" stroke-dashoffset="0" transform="rotate(-90 22 22)" stroke-linecap="round"/></svg><span>' + TIMER_SECONDS + "</span></div>" +
        '<div class="verdict">' + slam("#111", "htK", wordSVG("MISMATCH!", "#fff", "#111", RED)) +
        '<p class="verdict-text">Ni har tio sekunder på er att förklara. Sen röstar gänget: vem svarade rätt?</p></div>';
      hint.textContent = "Tryck på den som får poängen";
      actions.innerHTML = '<div class="vote-row"><button class="vote" data-vote="' + a.id + '">' + avatarHTML(a) + '<span data-fit="13">' + esc(a.name) + "</span></button>" +
        '<button class="vote" data-vote="' + b.id + '">' + avatarHTML(b) + '<span data-fit="13">' + esc(b.name) + "</span></button></div>" +
        '<button class="none-btn" data-vote="none">Ingen svarade rätt</button>';
      actions.querySelectorAll("[data-vote]").forEach(function (el) { el.onclick = function () { onVote(el.dataset.vote); }; });
      fitNames(actions);
      startVoteTimer();
    } else if (g.phase === "voted") {
      var w = g.winners[0] ? byId(g.winners[0]) : null;
      card.innerHTML = (w ? linesSVG(RED, 0.3, 50, 45) : linesSVG("#111", 0.1, 50, 45)) + meta + '<div class="verdict">' +
        (w ? slam(RED, "htRed", wordSVG(w.name, GOLD)) : slam("#111", "htK", wordSVG("Ingen", "#fff", "#111", RED))) +
        '<p class="verdict-text">' + (w ? "Gänget har talat. Plus ett till " + esc(w.name) + "." : "Ingen poäng den här gången.") + "</p></div>";
      hint.innerHTML = "&nbsp;";
      nextButton();
    }
  }

  var countTimer = null;
  function countdown() {
    var g = state.game;
    g.phase = "counting";
    renderRound();
    var card = $("card");
    var el = document.createElement("div");
    el.className = "count";
    card.appendChild(el);
    var steps = ["3", "2", "1", "NU!"];
    var i = 0;
    (function step() {
      var now = i === 3;
      el.innerHTML = now
        ? linesSVG(GOLD, 0.45, 50, 50) + '<div class="big slam">' + burstSVG(GOLD, "htGold") + wordSVG("NU!", RED) + "</div>"
        : '<div class="big num">' + wordSVG(steps[i], "#111") + "</div>";
      el.className = "count tick" + (now ? " now" : "");
      void el.offsetWidth;
      buzz(now ? [40, 30, 90] : 20);
      Sound.play(now ? "go" : "tick", i);
      i++;
      if (i < steps.length) countTimer = setTimeout(step, 800);
      else countTimer = setTimeout(function () { el.remove(); g.phase = "answer"; renderRound(); }, 900);
    })();
  }

  function pairKey(g) { return g.pair.slice().sort().join("|"); }
  function finishPair(g, matched) {
    var key = pairKey(g);
    g.played[g.pair[0]]++; g.played[g.pair[1]]++;
    g.pairCount[key] = (g.pairCount[key] || 0) + 1;
    if (matched) g.pairMatch[key] = (g.pairMatch[key] || 0) + 1;
  }

  function onMatch() {
    var g = state.game;
    g.scores[g.pair[0]]++; g.scores[g.pair[1]]++;
    g.winners = g.pair.slice();
    finishPair(g, true);
    g.history.push(true);
    g.phase = "match";
    buzz([20, 50, 20, 50, 60]);
    Sound.play("match");
    Confetti.match();
    renderRound();
  }
  function onMismatch() {
    var g = state.game;
    finishPair(g, false);
    g.history.push(false);
    g.phase = g.duo ? "miss2" : "vote";
    buzz([70, 90, 70]);
    Sound.play("miss");
    renderRound();
  }
  function onVote(id) {
    var g = state.game;
    if (id !== "none") { g.scores[id]++; g.winners = [id]; Sound.play("vote"); buzz([20, 40, 20]); }
    else Sound.play("miss");
    g.phase = "voted";
    renderRound();
  }

  $("score-btn").addEventListener("click", openScores);
  $("end-btn").addEventListener("click", function () {
    var g = state.game;
    if (!g || g.round <= 1 && g.phase === "ready") { clearTimeout(countTimer); show("setup"); return; }
    sheet('<h2>Avsluta spelet?</h2><p>Ni ser resultatet direkt.</p>' +
      '<div class="btn-row"><button class="btn btn-ghost" data-close>Spela vidare</button><button class="btn btn-primary" id="confirm-end">Visa resultat</button></div>');
    $("confirm-end").onclick = function () { closeSheet(); clearTimeout(countTimer); showResults(); };
  });
  $("cat-pill").addEventListener("click", function () {
    sheet("<h2>Byt nivå</h2><p>Gäller från nästa fråga.</p><div class=\"sheet-list\">" + CAT_KEYS.map(function (k) {
      return '<button class="cat-option" data-cat="' + k + '" aria-pressed="' + (state.cat === k) + '"><span class="cat-name" style="font-size:20px"><span class="dot"></span>' + CATS[k].name + "</span>" +
        '<span style="color:var(--muted);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center">' + (k === "warmup" && !state.unlocked ? "Gratis" : isOpen(k) ? "" : ICON.lock) + "</span></button>";
    }).join("") + "</div>");
    $("layer").querySelectorAll(".cat-option").forEach(function (b) {
      b.onclick = function () {
        closeSheet();
        chooseCat(b.dataset.cat, function () {
          var g = state.game;
          if (g.phase === "ready") { g.question = nextQuestion(state.cat); renderRound(true); } else renderRound();
          renderCats();
        });
      };
    });
  });

  function sortedPlayers() {
    var g = state.game;
    return state.players.slice().sort(function (a, b) { return g.scores[b.id] - g.scores[a.id]; });
  }

  function openScores() {
    var g = state.game;
    var list = sortedPlayers(), two = list.length > 6;
    sheet("<h2>Ställning</h2><div class=\"sheet-list" + (two ? " two\" style=\"grid-template-rows:repeat(" + Math.ceil(list.length / 2) + ",auto)" : "") + "\">" + list.map(function (p) {
      return '<div class="score-row">' + avatarHTML(p) + '<span class="nm" data-fit="12">' + esc(p.name) + '</span><span class="pts">' + g.scores[p.id] + "</span></div>";
    }).join("") + '</div><div class="sound-row"><span>Ljud</span><button class="top-btn" id="sound-toggle">' + (Sound.isOn() ? "På" : "Av") + '</button></div><button class="btn btn-ghost" data-close>Stäng</button>');
    $("sound-toggle").onclick = function () { var v = Sound.toggle(); this.textContent = v ? "På" : "Av"; renderSound(); };
    fitNames($("layer"));
  }

  // ---------- Resultat ----------
  // Scenen: smäll, figurerna i stort och namnet i guld. Ingen krona: figurerna har redan saker på huvudet.
  function stageHTML(figs, word, inner, pat) {
    return '<div class="stage">' + burstSVG(inner, pat) +
      '<div class="figs n' + figs.length + '">' + figs.map(function (f, i) { return '<div data-stage-fig="' + f + '" data-phase="' + (i * 0.33) + '"></div>'; }).join("") + "</div>" +
      '<div class="name">' + word + "</div></div>";
  }
  function mountStage() {
    $("winner").querySelectorAll("[data-stage-fig]").forEach(function (el) {
      window.Figures.mount(el, el.dataset.stageFig, { phase: parseFloat(el.dataset.phase) || 0 });
    });
  }

  function showResults() {
    var g = state.game;
    stopVoteTimer();
    var list = sortedPlayers();
    var top = list.length ? g.scores[list[0].id] : 0;
    var winners = list.filter(function (p) { return g.scores[p.id] === top; });
    var nobody = top === 0;
    if (nobody) winners = [];
    var shared = winners.length > 1;
    $("awards").hidden = g.duo;
    $("ranking").classList.toggle("dots", g.duo);
    var cols = !g.duo && list.length > 5;
    $("ranking").classList.toggle("cols", cols);
    // Två jämna kolumner: 6 spelare blir 3 + 3, 10 spelare blir 5 + 5
    $("ranking").style.gridTemplateRows = cols ? "repeat(" + Math.ceil(list.length / 2) + ", minmax(0, 58px))" : "";
    $("results").classList.toggle("duo", g.duo);
    if (g.duo) { showDuoResults(g); return; }
    var names = winners.slice(0, 3).map(function (p) { return p.name; }).join(" & ") + (winners.length > 3 ? " m.fl." : "");
    if (names.length > 16) names = winners.length + " vinnare"; // annars blir namnen för små för att läsa
    $("winner").innerHTML = nobody
      ? '<div class="winner-kicker">Inga poäng</div><h2 class="winner-title">Ingen vann</h2>' +
        stageHTML(list.slice(0, 2).map(function (p) { return p.fig; }), wordSVG("0 poäng", "#fff", "#111", RED), "#111", "htK") +
        '<div class="winner-pts wide">Ni känner inte varandra alls. Kör en runda till.</div>'
      : '<div class="winner-kicker">' + (shared ? "Delad seger" : "Kvällens vinnare") + "</div>" +
        '<h2 class="winner-title">' + (shared ? "Tankeläsarna" : "Tankeläsaren") + "</h2>" +
        stageHTML(winners.slice(0, 3).map(function (p) { return p.fig; }), wordSVG(names, GOLD), RED, "htRed") +
        '<div class="winner-pts">' + top + " poäng</div>";
    mountStage();

    var max = Math.max(1, top);
    $("ranking").innerHTML = list.map(function (p, i) {
      var first = !nobody && g.scores[p.id] === top;
      return '<div class="rank-row' + (first ? " first" : "") + '"><span class="n">' + (i + 1) + "</span>" + avatarHTML(p) + '<span class="nm" data-fit="11">' + esc(p.name) + "</span>" +
        '<span class="bar"><i style="width:' + Math.round(g.scores[p.id] / max * 100) + '%"></i></span><span class="pts">' + g.scores[p.id] + "</span></div>";
    }).join("");

    // Utmärkelser: bästa duon (flest matchningar) och mest osams duo (flest missar)
    var bestKey = null, bestVal = 0, worstKey = null, worstVal = 0;
    Object.keys(g.pairCount).forEach(function (k) {
      var m = g.pairMatch[k] || 0, miss = g.pairCount[k] - m;
      if (m > bestVal) { bestVal = m; bestKey = k; }
      if (miss > worstVal) { worstVal = miss; worstKey = k; }
    });
    function duo(k) { var n = k.split("|").map(function (id) { return esc(byId(id).name); }); return '<span class="duo-names"><b data-fit="10">' + n[0] + ' &amp;</b><b data-fit="10">' + n[1] + "</b></span>"; }
    function faces(k) { return k.split("|").map(function (id) { return avatarHTML(byId(id)); }).join(""); }
    $("awards").innerHTML =
      '<div class="award" style="--c:var(--gold)"><div class="award-k"><i></i>Bästa duon</div><div class="award-v">' + (bestKey ? faces(bestKey) + duo(bestKey) : '<span style="margin:0">Ingen än</span>') + '</div><div class="award-s">' + (bestKey ? bestVal + " match" + (bestVal === 1 ? "" : "er") : "Inga matcher") + "</div></div>" +
      '<div class="award" style="--c:var(--red)"><div class="award-k"><i></i>Mest osams</div><div class="award-v">' + (worstKey ? faces(worstKey) + duo(worstKey) : '<span style="margin:0">Ingen</span>') + '</div><div class="award-s">' + (worstKey ? worstVal + " miss" + (worstVal === 1 ? "" : "ar") : "Helt sams") + "</div></div>";

    show("results");
    fitNames($("results"));
    if (!nobody) celebrate(1);
    else Sound.play("miss");
  }

  // Två spelare: lagresultat i stället för vinnare, eftersom båda alltid har samma poäng.
  function showDuoResults(g) {
    var hits = g.history.filter(Boolean).length, played = g.history.length;
    var ratio = played ? hits / played : 0;
    var title = ratio >= 0.9 ? "Tankeläsare" : ratio >= 0.7 ? "Själsfränder" : ratio >= 0.5 ? "Bra koll" : ratio >= 0.3 ? "Ytligt bekanta" : "Främlingar";
    var line = ratio >= 0.9 ? "Ni delar en hjärna. Lite läskigt." : ratio >= 0.7 ? "Ni känner varandra på riktigt." : ratio >= 0.5 ? "Hälften rätt. Det finns mer att upptäcka." : ratio >= 0.3 ? "Ni borde nog ses oftare." : "Har ni ens träffats förut?";
    var good = ratio >= 0.5;
    $("winner").innerHTML =
      '<div class="winner-kicker">Ert lagresultat</div>' +
      '<h2 class="winner-title">' + title + "</h2>" +
      stageHTML(state.players.map(function (p) { return p.fig; }), wordSVG(hits + " av " + played, good ? RED : "#fff", good ? "#fff" : "#111", good ? "#111" : RED), good ? GOLD : "#111", good ? "htGold" : "htK") +
      '<div class="winner-pts wide">' + line + "</div>";
    mountStage();
    $("ranking").innerHTML = g.history.map(function (h, i) {
      return '<div class="dot ' + (h ? "hit" : "miss") + '">' + (i + 1) + "</div>";
    }).join("") || '<div class="dot" style="grid-column:1/-1">Inga rundor spelade</div>';
    show("results");
    if (ratio >= 0.5) celebrate(ratio >= 0.9 ? 1.4 : 1);
    else Sound.play("miss");
  }

  function celebrate(strength) {
    setTimeout(function () { Sound.play("win"); buzz([30, 60, 30, 60, 30, 60, 120]); Confetti.celebrate(strength); }, 250);
  }

  $("again-btn").addEventListener("click", startGame);
  $("new-players-btn").addEventListener("click", function () { show("setup"); });

  // ---------- Köp ----------
  // Demo: riktiga köp kopplas in via App Store / Google Play när appen paketeras.
  function setUnlocked(v) {
    state.unlocked = v;
    store.set("unlocked", v);
    if (NPrefs) NPrefs.set({ key: "unlocked", value: v ? "1" : "0" }).catch(function () {});
    renderCats();
  }
  function celebrateUnlock() {
    toast("Upplåst. Ha så kul!");
    Sound.play("unlock");
    buzz([20, 40, 20, 40, 80]);
  }
  function ownsUnlock(purchases) {
    return (purchases || []).some(function (p) { return p.productIdentifier === PRODUCT_ID; });
  }
  // Hämtar pris och tidigare köp från App Store
  function syncStore() {
    if (!NIAP) return Promise.resolve();
    var price = NIAP.getProducts({ productIdentifiers: [PRODUCT_ID], productType: "inapp" }).then(function (r) {
      var prod = r && r.products && r.products[0];
      if (prod && prod.priceString) { storePrice = prod.priceString; renderCats(); }
    }).catch(function () {});
    var owned = NIAP.getPurchases({ productType: "inapp" }).then(function (r) {
      if (ownsUnlock(r && r.purchases) && !state.unlocked) setUnlocked(true);
    }).catch(function () {});
    return Promise.all([price, owned]);
  }

  function restorePurchase(btn, onDone) {
    if (!NIAP) { toast("Återställning fungerar i appen"); return; }
    var label = btn.innerHTML;
    btn.disabled = true; btn.textContent = "Letar …";
    function reset() { btn.disabled = false; btn.innerHTML = label; }
    NIAP.restorePurchases().catch(function () {}).then(function () {
      return NIAP.getPurchases({ productType: "inapp" });
    }).then(function (r) {
      if (ownsUnlock(r && r.purchases)) { setUnlocked(true); closeSheet(); toast("Ditt köp är återställt"); onDone && onDone(); }
      else { reset(); toast("Hittade inget köp på det här Apple-ID:t"); }
    }).catch(function () { reset(); toast("Kunde inte nå App Store just nu"); });
  }

  function openUnlock(onDone) {
    var price = priceText();
    sheet('<h2>Lås upp Juicy och Crazy</h2>' +
      "<p>300 frågor till, för kvällar när Warm up inte räcker. Du betalar en gång och har dem för alltid. Ingen prenumeration.</p>" +
      (price ? '<div class="price" id="price">' + esc(price) + "<small>engångsköp</small></div>" : "") +
      '<button class="btn btn-primary" id="buy">' + (price ? "Lås upp för " + esc(price) : "Lås upp") + "</button>" +
      '<div class="btn-row"><button class="top-btn" data-close>Inte nu</button><button class="top-btn" id="restore">Återställ köp</button></div>' +
      '<p class="fine">Juicy och Crazy är för dig som är 18 år eller äldre.' + (IS_NATIVE ? "" : " Testversion: knappen låser upp direkt, inget köp görs.") + "</p>");
    var buy = $("buy");
    buy.onclick = function () {
      if (!NIAP) { setUnlocked(true); closeSheet(); celebrateUnlock(); onDone && onDone(); return; }
      buy.disabled = true;
      buy.textContent = "Öppnar App Store …";
      NIAP.purchaseProduct({ productIdentifier: PRODUCT_ID, productType: "inapp", quantity: 1 }).then(function () {
        setUnlocked(true); closeSheet(); celebrateUnlock(); onDone && onDone();
      }).catch(function (err) {
        buy.disabled = false;
        buy.textContent = price ? "Lås upp för " + price : "Lås upp";
        var msg = String((err && (err.message || err.code)) || err || "");
        if (!/cancel/i.test(msg)) toast("Köpet gick inte igenom. Försök igen.");
      });
    };
    $("restore").onclick = function () { restorePurchase(this, onDone); };
    if (IS_NATIVE && !storePrice) syncStore().then(function () {
      var p = $("price"), bb = $("buy");
      if (storePrice && bb && !bb.disabled) { bb.textContent = "Lås upp för " + storePrice; price = storePrice; if (!p) bb.insertAdjacentHTML("beforebegin", '<div class="price" id="price">' + esc(storePrice) + "<small>engångsköp</small></div>"); }
    });
  }

  // ---------- Meny: regler, vanliga frågor, integritet, ljud, köp ----------
  var CONTACT_EMAIL = "support@coalbun.com";
  var WEBSITE = "coalbun.com";
  var APP_VERSION = "1.1";
  var GAMES = [
    { name: "ACT RUSH", sub: "500 frågor & charader", url: "https://apps.apple.com/se/app/act-rush-partyspel-charader/id6790179657", tile: "#fff",
      icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7"/><path d="M12 14v-3.5M10 3h4M18.5 7.5L20 6"/></svg>' },
    { name: "Tune Trivia", sub: "Musikquiz med vänner", url: "https://apps.apple.com/se/app/tune-trivia-musikquiz/id6770267505", tile: "#fff",
      icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>' }
  ];
  var CHEV = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var BACK = '<button class="back" data-back><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Meny</button>';
  function wireBack() { var b = $("layer").querySelector("[data-back]"); if (b) b.onclick = openMenu; }

  function openMenu() {
    sheet("<h2>Meny</h2><div class=\"menu-list\">" +
      '<button class="menu-row" data-go="rules">Så spelar ni' + CHEV + "</button>" +
      '<button class="menu-row" data-go="faq">Vanliga frågor' + CHEV + "</button>" +
      '<button class="menu-row" data-go="games">Fler spel från oss' + CHEV + "</button>" +
      '<button class="menu-row" data-go="policy">Integritetspolicy' + CHEV + "</button>" +
      '<button class="menu-row" id="menu-sound">Ljud<span class="val">' + (Sound.isOn() ? "På" : "Av") + "</span></button>" +
      (state.unlocked ? "" : '<button class="menu-row" id="menu-restore">Återställ köp<span class="val">' + ICON.lock + "</span></button>") +
      '<a class="menu-row" href="mailto:' + CONTACT_EMAIL + '" style="text-decoration:none;color:inherit">Kontakt<span class="val" style="user-select:text;-webkit-user-select:text">' + esc(CONTACT_EMAIL) + "</span></a>" +
      '<a class="menu-row" href="https://' + WEBSITE + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Webbplats<span class="val">' + esc(WEBSITE) + CHEV + "</span></a>" +
      '</div><p class="menu-foot">Synk ' + APP_VERSION + " · Coalbun Studios</p>");
    $("layer").querySelectorAll("[data-go]").forEach(function (b) {
      b.onclick = function () { ({ rules: openRules, faq: openFaq, games: openGames, policy: openPolicy })[b.dataset.go](); };
    });
    $("menu-sound").onclick = function () { var v = Sound.toggle(); this.querySelector(".val").textContent = v ? "På" : "Av"; renderSound(); };
    if ($("menu-restore")) $("menu-restore").onclick = function () { restorePurchase(this); };
  }

  function openRules() {
    sheet(BACK + "<h2>Så spelar ni</h2><ol class=\"rules\">" +
      "<li><span>Skriv in 2–10 spelare och välj nivå.</span></li>" +
      "<li><span>Varje runda möts <b>två spelare</b> och får en fråga, till exempel <i>Vem av er är smartast?</i></span></li>" +
      "<li><span>Tryck på <b>Räkna ner</b>. På noll säger ni båda ett namn högt: ditt eget eller den andras.</span></li>" +
      "<li><span><b>Samma namn:</b> en poäng var. <b>Olika:</b> förklara er. Gänget röstar, och den som svarade rätt får poängen.</span></li>" +
      "<li><span>Är det en <b>har</b>-fråga och ingen av er har gjort det? Säg den som mest troligt skulle.</span></li>" +
      "<li><span>Flest poäng efter sista rundan vinner. Är ni bara två spelar ni som ett lag och ser hur många matcher ni klarar.</span></li>" +
      "</ol>");
    wireBack();
  }

  function openGames() {
    sheet(BACK + "<h2>Fler spel från oss</h2><div class=\"menu-list\">" + GAMES.map(function (g) {
      return '<a class="game-row" href="' + g.url + '" target="_blank" rel="noopener"><span class="game-ico" style="background:' + g.tile + '">' + g.icon + '</span>' +
        '<span class="game-txt"><b>' + esc(g.name) + "</b><small>" + esc(g.sub) + "</small></span>" + CHEV + "</a>";
    }).join("") + '</div><p class="menu-foot">Öppnas i App Store</p>');
    wireBack();
  }

  function openFaq() {
    var qa = [
      ["Kostar det något?", "Warm up med 100 frågor är gratis. Juicy och Crazy låser du upp tillsammans med ett enda köp. Det finns ingen prenumeration."],
      ["Jag har köpt, men nivåerna är låsta", "Öppna menyn och tryck på Återställ köp. Du måste vara inloggad med samma Apple-ID som när du köpte."],
      ["Hur lång tid tar ett spel?", "7 till 10 rundor, ungefär tio minuter. Alla spelar lika många gånger."],
      ["Kan vi välja figurer?", "Ja. Bredvid namnfältet ligger en slumpad figur. Tryck på den för att välja en annan. Varje figur kan bara användas av en spelare åt gången."],
      ["Var sparas namnen?", "Bara på din telefon. Inget skickas till oss eller någon annan."]
    ];
    sheet(BACK + "<h2>Vanliga frågor</h2><div class=\"faq scroll\">" + qa.map(function (x) {
      return "<details><summary>" + esc(x[0]) + "</summary><p>" + esc(x[1]) + "</p></details>";
    }).join("") + "</div>");
    wireBack();
  }

  function openPolicy() {
    sheet(BACK + "<h2>Integritetspolicy</h2><div class=\"policy scroll\">" +
      "<p><b>Vi samlar inte in några uppgifter om dig.</b> Det finns ingen inloggning, ingen reklam, ingen spårning och ingen analys.</p>" +
      "<p><b>Namn</b> på spelare sparas bara i appen på din telefon och försvinner när du tar bort dem eller appen.</p>" +
      "<p><b>Kamera och bilder</b> används inte. Appen ber aldrig om att få komma åt dem.</p>" +
      "<p><b>Köp</b> görs via Apple. Vi ser aldrig dina betalningsuppgifter.</p>" +
      "<p><b>Juicy och Crazy</b> är för dig som är 18 år eller äldre.</p>" +
      "<p>Frågor? Mejla " + esc(CONTACT_EMAIL) + ".</p></div>");
    wireBack();
  }
  $("menu-btn").addEventListener("click", openMenu);

  // Introt försvinner av sig självt, eller direkt om man trycker
  (function () {
    var intro = $("intro");
    if (!intro) return;
    function done() { if (intro.parentNode) intro.parentNode.removeChild(intro); }
    intro.addEventListener("animationend", function (e) { if (e.animationName === "introOut") done(); });
    intro.addEventListener("pointerdown", done);
    setTimeout(done, 2600);
  })();

  // ---------- Sheets, toast, skärmar ----------
  function sheet(html) {
    $("layer").innerHTML = '<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true">' + html + "</div>";
    $("layer").querySelectorAll("[data-close]").forEach(function (el) { el.onclick = closeSheet; });
  }
  function closeSheet() { $("layer").innerHTML = ""; }

  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 2200);
  }

  function show(id) {
    ["setup", "round", "results"].forEach(function (s) { $(s).hidden = s !== id; });
    if (id === "setup") { renderPlayers(); renderCats(); }
  }

  show("setup");

  if (IS_NATIVE) {
    if (NStatus) NStatus.setStyle({ style: "DARK" }).catch(function () {});
    if (NPrefs) NPrefs.get({ key: "unlocked" }).then(function (r) { if (r && r.value === "1" && !state.unlocked) setUnlocked(true); }).catch(function () {});
    syncStore();
  }
})();
</script>
</body>
</html>
