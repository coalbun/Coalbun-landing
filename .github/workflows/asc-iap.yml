# Kollar eller skapar köpet "Juicy och Crazy" i App Store Connect.
# Starta: GitHub → Actions → "App Store: köpet" → Run workflow. Använder samma hemligheter som iOS-bygget.
name: "App Store: köpet"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "kolla = visa läget, skapa = skapa det som saknas"
        type: choice
        options: [kolla, skapa]
        default: kolla

jobs:
  iap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Förbered nyckel
        run: |
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          { echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          python3 scripts/fix-asc-key.py "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          pip install --quiet "pyjwt[crypto]"

      - name: Köpet
        run: python3 scripts/asc-iap.py "${{ github.event.inputs.mode }}"

      - name: Ta bort nyckeln
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
