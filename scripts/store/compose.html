<!doctype html>
<html><head><meta charset="utf-8">
<!-- Ramen runt App Store-bilderna: rubrik + telefon. Körs av compose.js. -->
<style>
@font-face { font-family: "Outfit"; font-weight: 100 900; src: url("../../app/fonts/outfit-latin.woff2") format("woff2"); }
@font-face { font-family: "Outfit"; font-weight: 100 900; src: url("../../app/fonts/outfit-latin-ext.woff2") format("woff2"); unicode-range: U+0100-02BA; }
:root { --bg: #0b0b0b; --red: #d0283a; --gold: #f0b638; }
html, body { margin: 0; width: 440px; height: 956px; overflow: hidden; background: var(--bg); }
body { position: relative; font-family: "Outfit", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
.glow { position: absolute; inset: 0; background: radial-gradient(80% 32% at 50% 6%, rgba(255,255,255,.14), transparent 70%); }
.lines { position: absolute; inset: 0; }
.dots { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.11) 2.4px, transparent 2.9px) 0 0 / 15px 15px;
  -webkit-mask: radial-gradient(ellipse 90% 40% at 50% 100%, #000, transparent 75%); }
.head { position: absolute; left: 22px; right: 22px; top: 56px; text-align: center; }
.head .l { display: table; margin: 0 auto; white-space: nowrap; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em; }
.head .l1 { color: #fff; }
.head .l2 { color: var(--gold); transform: rotate(-2.5deg) skewX(-8deg); margin-top: 6px; text-shadow: 3px 4px 0 var(--red); }
.phone { position: absolute; left: 50%; top: 200px; width: 336px; height: 711px; transform: translateX(-50%); }
.phone .shade { position: absolute; inset: 0; transform: translate(11px, 13px); border-radius: 58px;
  background: radial-gradient(circle, rgba(255,255,255,.5) 1.7px, transparent 2.1px) 0 0 / 6px 6px; }
.phone .body { position: absolute; inset: 0; border-radius: 58px; background: #000; box-shadow: 0 0 0 3.5px #fff; }
.phone .screen { position: absolute; left: 8px; top: 8px; width: 320px; height: 695px; border-radius: 50px; overflow: hidden; background: var(--bg); }
.phone .screen img { display: block; width: 100%; height: 100%; }
.island { position: absolute; left: 50%; top: 8px; width: 92px; height: 27px; transform: translateX(-50%); background: #000; border-radius: 14px; }
.status { position: absolute; left: 0; right: 0; top: 0; height: 45px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 42px; font: 600 12.6px/1 -apple-system, "Outfit", sans-serif; letter-spacing: -.01em; }
.status .ic { display: flex; gap: 5px; align-items: center; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body>
<div class="glow"></div>
<svg class="lines" id="lines" viewBox="0 0 440 956" preserveAspectRatio="none"></svg>
<div class="dots"></div>
<div class="head" id="head"><span class="l l1" id="l1"></span><span class="l l2" id="l2"></span></div>
<svg class="confetti" id="conf" viewBox="0 0 440 956"></svg>
<div class="phone">
  <div class="shade"></div>
  <div class="body"></div>
  <div class="screen"><img id="img">
    <div class="status"><span>9:41</span><span class="ic">
      <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".8" fill="#fff"/><rect x="4.6" y="5" width="3" height="6" rx=".8" fill="#fff"/><rect x="9.2" y="2.6" width="3" height="8.4" rx=".8" fill="#fff"/><rect x="13.8" y="0" width="3" height="11" rx=".8" fill="#fff"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 2.3c2.2 0 4.2.8 5.7 2.2l1.1-1.2C12.5 1.6 10.1.6 7.5.6S2.5 1.6.7 3.3l1.1 1.2C3.3 3.1 5.3 2.3 7.5 2.3z" fill="#fff"/><path d="M7.5 5.6c1.3 0 2.5.5 3.4 1.3l1.1-1.2C10.8 4.6 9.2 3.9 7.5 3.9S4.2 4.6 3 5.7l1.1 1.2c.9-.8 2.1-1.3 3.4-1.3z" fill="#fff"/><path d="M7.5 7.3c.8 0 1.4.3 1.9.8L7.5 10.2 5.6 8.1c.5-.5 1.1-.8 1.9-.8z" fill="#fff"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.4" fill="none" stroke="#fff" stroke-opacity=".45"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"/><path d="M23 4v4c.8-.3 1.4-1.1 1.4-2S23.8 4.3 23 4z" fill="#fff" fill-opacity=".45"/></svg>
    </span></div>
    <div class="island"></div>
  </div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get('d')));
document.getElementById('img').src = d.img;
document.getElementById('l1').textContent = d.l1;
document.getElementById('l2').textContent = d.l2;
// Fartlinjer från rubriken, svaga
(function () {
  let s = '', seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const cx = 220, cy = 120, n = 46;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + (rnd() - .5) * .08, dw = .006 + rnd() * .01, r0 = 150, r1 = 1300;
    s += `<path d="M${cx + r0 * Math.cos(a)},${cy + r0 * Math.sin(a)} L${cx + r1 * Math.cos(a - dw)},${cy + r1 * Math.sin(a - dw)} L${cx + r1 * Math.cos(a + dw)},${cy + r1 * Math.sin(a + dw)} Z" fill="#fff" opacity=".05"/>`;
  }
  document.getElementById('lines').innerHTML = s;
})();
// Lite konfetti runt rubriken
document.getElementById('conf').innerHTML = (d.conf || []).map(([x, y, r, c]) =>
  `<rect x="-4" y="-7" width="8" height="14" rx="1.2" fill="${c}" stroke="#111" stroke-width="1.6" transform="translate(${x},${y}) rotate(${r})"/>`).join('');
// Rubriken så stor som möjligt, men varje rad får plats
function fit() {
  const max = 396;
  let size = d.size || 46;
  const l1 = document.getElementById('l1'), l2 = document.getElementById('l2');
  for (; size > 20; size -= 0.5) {
    l1.style.fontSize = l2.style.fontSize = size + 'px';
    if (l1.scrollWidth <= max && l2.scrollWidth <= max - 14) break;
  }
}
document.fonts.ready.then(() => { fit(); document.body.dataset.ready = '1'; });
</script>
</body></html>
